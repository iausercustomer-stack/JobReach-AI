  <script>

    const DEMO_SCENARIOS = [
      { id: "demo-1", short: "Registration Fee", label: "Fake Company Asking for Registration Fee (EN)", cat: "Advance Fee", lang: "en", text: "Company: Apex Global Solutions Pvt Ltd\nRole: Junior Operations Executive\nSalary: ₹42,000 per month\nLocation: Noida\nCongratulations! You are selected without interview. Pay ₹999 registration fee to confirm your job before 6:00 PM today. Contact hr.apexglobal99@gmail.com or WhatsApp +91 98112 34567." },
      { id: "demo-2", short: "Hinglish WFH", label: "Unrealistic WFH Earnings (Hinglish)", cat: "WFH Scam", lang: "hinglish", text: "Part-time Work From Home! Ghar baithe roz ₹5,000 kamayein — 10th pass, no experience required, only smartphone needed. Job ke liye pehle ₹1500 registration fees jama karo aur turant joining pao. WhatsApp +91 90123 45678." },
      { id: "demo-3", short: "Telegram Tasks", label: "Telegram Prepaid Task Scam (EN)", cat: "Task Scam", lang: "en", text: "VIP Telegram Task Group! Earn ₹5,000 to ₹10,000 daily by liking YouTube videos and rating Google Maps hotels. Complete 3 prepaid merchant tasks and recharge wallet to unlock your frozen salary payout. Join https://t.me/vip_daily_tasks_hr" },
      { id: "demo-4", short: "Hindi Internship", label: "Fake Internship with Security Deposit (Hindi)", cat: "Internship Scam", lang: "hi", text: "कंपनी: BrightFuture Tech Solutions\nपद: Web Development Intern\nस्टाइपेंड: ₹25,000 per month\nबिना इंटरव्यू के नौकरी पाने के लिए ₹2,000 सिक्योरिटी डिपॉजिट दें और लैपटॉप किट प्राप्त करें। संपर्क: +91 88001 22334" },
      { id: "demo-5", short: "Gmail + Fake Site", label: "Fake Recruiter Using Gmail & Suspicious Site", cat: "Impersonation", lang: "en", text: "Company: Tata Consultancy Services (TCS)\nRole: Associate Software Engineer\nSalary: 7.5 LPA\nLocation: Hyderabad\nComplete verification at https://tcs-hr-onboarding-verify.top/apply within 2 hours. Reply to tcs.hiring.desk2026@gmail.com.", jobUrl: "https://tcs-hr-onboarding-verify.top/apply" },
      { id: "demo-6", short: "Offer Mismatch", label: "Offer Letter with Contradictory Company Info", cat: "Conflict", lang: "en", text: "Company: Infosys Limited\nRole: Systems Engineer\nSalary: 4.5 LPA\nLocation: Bengaluru\nRecruiter Email: hr@infosys-careers-desk.xyz\nRequisition ID: INF-2026-881", secondaryText: "Company: GlobalTech Staffing Services\nRole: Data Entry Operator\nSalary: ₹18,000 per month\nLocation: Gurugram\nEmail: hiring@globaltechstaff.online" },
      { id: "demo-7", short: "Fake Infosys URL", label: "Suspicious Link Impersonating Known Company", cat: "Phishing URL", lang: "en", text: "Company: Infosys\nRole: Graduate Engineer Trainee\nApply immediately on our official portal: https://infosys.careers-verification.xyz/apply?redirect=http://verify-hr.top\nOffer will be cancelled within 3 hours if verification is incomplete.", jobUrl: "https://infosys.careers-verification.xyz/apply?redirect=http://verify-hr.top" },
      { id: "demo-8", short: "Genuine Razorpay", label: "Genuine Job Ad (No Upfront Fee)", cat: "Legitimate", lang: "en", text: "Company: Razorpay\nRole: Backend Software Engineer\nSalary: 16-22 LPA\nLocation: Bengaluru\nRequisition ID: RZP-ENG-4092\nApply via https://razorpay.com/jobs/ or contact recruiting@razorpay.com. Selection involves a technical round and two engineering interviews.", jobUrl: "https://razorpay.com/jobs/" },
      { id: "demo-9", short: "Anti-Fraud Notice", label: "Genuine Email with Anti-Fraud Disclaimer", cat: "Legitimate", lang: "en", text: "Company: Infosys Limited\nRole: Specialist Programmer\nSalary: 9.5 LPA\nLocation: Pune\nUrgent reminder: confirm your interview slot for Thursday at 11:00 AM via careers@infosys.com or https://www.infosys.com/careers/.\nImportant Notice: Infosys does not charge any fee at any stage. Never pay any registration fee during recruitment.", jobUrl: "https://www.infosys.com/careers/" },
      { id: "demo-10", short: "Incomplete Ad", label: "Incomplete Job Ad Requiring Verification", cat: "Unverified", lang: "en", text: "Hiring immediately for office assistant and back-office support roles. Good salary package. Freshers welcome. Call +91 98765 11223 for interview timing." },
    ];

    const ACADEMY_MODULES = [
      { n: 1, title: "Fake Job Advertisements", cat: "Job Ads", summary: "Vague duties, inflated salaries, and private WhatsApp/Telegram hiring funnels.", redFlags: ["No official corporate website or domain", "Guaranteed selection without screening"], safe: "Search the company's official career portal manually." },
      { n: 2, title: "Advance Registration Fee Scams", cat: "Payments", summary: "Why 'refundable' registration, interview, or verification fees are always fraud.", redFlags: ["₹500–₹3,000 upfront fee demand", "Promise of refund in your first paycheck"], safe: "Never pay any fee to apply, interview, or confirm a job." },
      { n: 3, title: "Fake Internships & Deposits", cat: "Students", summary: "Laptop deposits and paid certificates disguised as guaranteed internships.", redFlags: ["Security deposit for laptop or ID kit", "Mandatory paid training before joining"], safe: "Verify internship partners with your college placement cell." },
      { n: 4, title: "Work-From-Home Traps", cat: "Remote Work", summary: "Unrealistic ₹5,000/day typing offers and fake legal-notice penalty threats.", redFlags: ["₹3,000–₹10,000/day for simple typing", "Fake accuracy-penalty legal emails"], safe: "Ignore fake legal threats from unverified typing portals." },
      { n: 5, title: "Telegram Prepaid Task Scams", cat: "Task Fraud", summary: "Small ₹200 bait payouts followed by escalating VIP wallet recharges.", redFlags: ["Paid to like YouTube videos or rate hotels", "Must recharge wallet to unlock earnings"], safe: "Leave the group immediately and never recharge any wallet." },
      { n: 6, title: "Fraudulent Offer Letters", cat: "Documents", summary: "Copied corporate logos, mismatched company names, and Gmail HR contacts.", redFlags: ["Contradictory employer or salary details", "Offer issued without any interview"], safe: "Compare every offer field against the original job posting." },
      { n: 7, title: "Recruiter & HR Impersonation", cat: "Identity", summary: "Spotting lookalike domains like @company-careers.xyz and Gmail spoofing.", redFlags: ["Lookalike domain adding '-hr' or '-verify'", "Refusal to email from official corporate domain"], safe: "Check the exact domain after '@' against the official site." },
      { n: 8, title: "Phishing Recruitment Sites", cat: "URL Security", summary: "Reading registrable domains right-to-left (infosys.careers-verification.xyz).", redFlags: ["Brand in subdomain instead of registrable domain", "Disposable TLDs (.xyz, .top, .icu)"], safe: "Inspect links structurally without clicking them." },
      { n: 9, title: "Personal & Banking Data Theft", cat: "Privacy", summary: "Protecting Aadhaar, PAN, OTPs, UPI PINs, and bank passwords during hiring.", redFlags: ["Requests for OTP, UPI PIN, ATM PIN, or CVV", "Early demands for bank credentials"], safe: "HR never needs your OTP, UPI PIN, or netbanking password." },
      { n: 10, title: "Remote-Access Scams (AnyDesk)", cat: "Device Safety", summary: "Why recruiters should never ask for remote desktop control of your device.", redFlags: ["Instructions to install AnyDesk/TeamViewer", "Requests for 9-digit remote workspace code"], safe: "Uninstall remote-access apps immediately and call 1930 if compromised." },
    ];

    const QUIZ_QUESTIONS = [
      { sender: "WhatsApp HR (+91 98112 44019)", msg: "Selected for WFH Data Entry (₹45,000/mo) without interview. Pay ₹999 refundable registration fee today.", ans: "scam", exp: "Fraudulent: Guaranteed selection without interview plus an upfront 'refundable' registration fee." },
      { sender: "careers@infosys.com", msg: "Urgent reminder: technical interview tomorrow at 11 AM. Note: Infosys never charges any registration fee during recruitment.", ans: "legitimate", exp: "Legitimate: Official domain, real interview scheduling, and protective anti-fraud disclaimer." },
      { sender: "SMS Job Alert", msg: "Apply for TCS Campus Hiring at https://tcs.careers-verification.xyz/apply within 2 hours.", ans: "scam", exp: "Fraudulent: Lookalike URL — actual domain is 'careers-verification.xyz', not 'tcs.com'." },
      { sender: "Hindi Internship Forward", msg: "बिना इंटरव्यू के नौकरी पाने के लिए ₹2,000 सिक्योरिटी डिपॉजिट दें।", ans: "scam", exp: "Fraudulent: Hindi security-deposit demand promising selection without interview." },
      { sender: "recruiting@razorpay.com", msg: "Thank you for applying for Backend Engineer (Req ID: RZP-4092). Technical round details at https://razorpay.com/jobs/.", ans: "legitimate", exp: "Legitimate: Official email/domain alignment, requisition ID, and zero payment demands." },

    // =========================================================================
    // 2. STATE & STORAGE
    // =========================================================================
    const STORE = { SETTINGS: "jobguard_settings_v2", HISTORY: "jobguard_history_v1", QUIZ: "jobguard_quiz_best_v1" };
    const STATE = {
      route: "/",
      backendAvailable: false,
      settings: { lang: "en", theme: "light", reducedMotion: false, saveHistory: true, redactSensitive: true },
      history: [],
      // Unified Verification Studio state
      inputMode: "paste", // 'paste' | 'url' | 'ocr' | 'doc'
      step: 1, // 1 = Submit, 2 = Review 10 Fields, 3 = 7-Category Report
      inputText: "",
      secondaryText: "",
      showCompareBox: false,
      inputUrl: "",
      isDemoInput: false,
      extractedDraft: null,
      fieldEdits: {},
      currentReport: null,
      isLoading: false,
      // Quick URL Inspector inside URL mode
      urlResult: null,
      // OCR & Doc state
      ocrImageUrl: null,
      ocrFileName: "",
      ocrProgress: 0,
      ocrStatus: "",
      docWarnings: [],
      // Learn hub tab
      learnTab: "academy", // 'academy' | 'quiz'
      // History filter
      histSearch: "",
      histRisk: "ALL",
      // Quiz
      quizIdx: 0, quizChoice: null, quizSubmitted: false, quizScore: 0, quizDone: false, quizBest: 0,
      expandedCats: {},
    };

    function loadState() {
      try {
        STATE.settings = { ...STATE.settings, ...JSON.parse(localStorage.getItem(STORE.SETTINGS) || "{}") };
        STATE.history = JSON.parse(localStorage.getItem(STORE.HISTORY) || "[]");
        STATE.quizBest = Number(localStorage.getItem(STORE.QUIZ) || "0");
      } catch {}
      applyTheme();
    }
    function saveSettings() { try { localStorage.setItem(STORE.SETTINGS, JSON.stringify(STATE.settings)); } catch {} }
    function saveHistory() { try { localStorage.setItem(STORE.HISTORY, JSON.stringify(STATE.history.slice(0, 100))); } catch {} }
    function applyTheme() {
      document.documentElement.classList.toggle("dark", STATE.settings.theme === "dark");
      document.documentElement.classList.toggle("reduced-motion", STATE.settings.reducedMotion);
      const ti = document.getElementById("theme-icon");
      if (ti) ti.textContent = STATE.settings.theme === "dark" ? "☀️" : "🌙";
      const lp = document.getElementById("lang-pill");
      if (lp) lp.textContent = STATE.settings.lang === "hi" ? "EN" : "हिंदी";
    }
    function t(k) { return (I18N[STATE.settings.lang] && I18N[STATE.settings.lang][k]) || I18N.en[k] || k; }
    function esc(s) { return s == null ? "" : String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
    function toast(msg, kind) {
      const box = document.getElementById("toast-box");
      if (!box) return;
      const d = document.createElement("div");
      const bg = kind === "error" ? "bg-rose-600" : kind === "warn" ? "bg-amber-600" : "bg-indigo-600";
      d.className = `pointer-events-auto px-4 py-3 rounded-2xl text-white text-xs font-semibold shadow-xl ${bg}`;
      d.textContent = msg;
      box.appendChild(d);
      setTimeout(() => d.remove(), 3000);
    }

    async function detectBackend() {
      const b = document.getElementById("api-badge");
      try {
        const r = await fetch("/api/health");
        if (r.ok) {
          STATE.backendAvailable = true;
          if (b) { b.textContent = "API Live"; b.className = "hidden sm:inline-block px-1.5 py-0.5 rounded-md text-[10px] font-semibold bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800"; }
          return;
        }
      } catch {}
      STATE.backendAvailable = false;
    }

    // =========================================================================

    // =========================================================================
    const PROTECTED_EMPLOYERS = {

    const SUSPICIOUS_TLDS = new Set(["xyz", "top", "click", "loan", "work", "gq", "tk", "ml", "cf", "ga", "buzz", "icu", "vip", "online", "site"]);
    const SHORTENERS = new Set(["bit.ly", "tinyurl.com", "t.co", "goo.gl", "is.gd", "rb.gy", "cutt.ly", "wa.me"]);
    const PERSONAL_DOMAINS = new Set(["gmail.com", "yahoo.com", "yahoo.co.in", "outlook.com", "hotmail.com", "rediffmail.com"]);

    function localRedact(text) {
      if (!text) return { redacted: "", counts: {} };
      let out = text;

    function generateSampleJobScreenshot() {

      ctx.fillStyle = "#4F46E5"; ctx.fillRect(0, 0, 760, 48);
      ctx.fillStyle = "#FFFFFF"; ctx.font = "bold 17px Arial"; ctx.fillText("WHATSAPP RECRUITER SCREENSHOT (SYNTHETIC DEMO)", 20, 30);

    function rotateOcrImg() {
      if (!STATE.ocrImageUrl) return;
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"); c.width = img.height; c.height = img.width;
        const ctx = c.getContext("2d"); ctx.translate(c.width / 2, c.height / 2); ctx.rotate(Math.PI / 2); ctx.drawImage(img, -img.width / 2, -img.height / 2);
        STATE.ocrImageUrl = c.toDataURL("image/png"); render();
      };
      img.src = STATE.ocrImageUrl;
    }

    function enhanceOcrContrast() {
      if (!STATE.ocrImageUrl) return;
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
        const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0);
        const id = ctx.getImageData(0, 0, c.width, c.height); const d = id.data;
        for (let i = 0; i < d.length; i += 4) { const l = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; const v = l > 145 ? 255 : Math.max(0, l * 0.45); d[i] = d[i + 1] = d[i + 2] = v; }
        ctx.putImageData(id, 0, 0); STATE.ocrImageUrl = c.toDataURL("image/png"); STATE.ocrStatus = "High-contrast filter applied."; render();
      };
      img.src = STATE.ocrImageUrl;
    }

    async function runLocalOcr() {
      if (!STATE.ocrImageUrl) return toast("Upload or generate a screenshot first.", "warn");
      STATE.ocrProgress = 15; STATE.ocrStatus = "Running local browser OCR (Tesseract.js)..."; render();
      try {
        if (window.Tesseract && typeof window.Tesseract.recognize === "function") {
          const res = await window.Tesseract.recognize(STATE.ocrImageUrl, "eng", {
            logger: (m) => { if (m && typeof m.progress === "number") { STATE.ocrProgress = Math.max(15, Math.round(m.progress * 100)); const b = document.getElementById("ocr-bar"); if (b) b.style.width = STATE.ocrProgress + "%"; } }
          });
          if (res && res.data && res.data.text && res.data.text.trim().length > 3) {
            STATE.inputText = res.data.text.trim(); STATE.ocrProgress = 100; STATE.ocrStatus = "Text extracted! Review below or continue to 10-field review."; render(); return;
          }
        }
      } catch {}
      STATE.ocrProgress = 100;
      STATE.inputText = STATE.ocrFileName.startsWith("demo-")
        ? "Company: Infosys Hiring Desk\nRole: Junior Software Associate (WFH)\nSelected without interview! Salary: Rs 48,000/month\nPay Rs 999 refundable registration fee today at: https://infosys.careers-verification.xyz/apply"
        : STATE.inputText;
      STATE.ocrStatus = STATE.inputText ? "Extracted text from demo canvas. Ready for 10-field review." : "Offline OCR worker unavailable; paste visible text below.";
      render();
    }

      const f = ev.target.files && ev.target.files[0];

      if (STATE.backendAvailable) {
        const fd = new FormData(); fd.append("file", f);

    function downloadBlob(content, filename, mime) {
      const b = new Blob([content], { type: mime });
      const u = URL.createObjectURL(b);
      const a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u);
    }

            <span class="text-[9px] font-bold uppercase tracking-wider text-[var(--ink-muted)] mt-0.5">/ 100</span>
          </div>
        </div>

    }

    function renderStep2Review() {

        ${r.indicators.length ? `

        <!-- Recommended Actions & Transparency -->

            <button type="button" onclick="STATE.step=1; nav('/verify')" class="btn-indigo px-5 py-2.5 rounded-full text-xs font-bold">+ New Verification</button>

      if (!cv) return;
      if (riskChart) riskChart.destroy();
      const hi = STATE.history.filter((h) => h.risk_level === "HIGH RISK").length;
      const med = STATE.history.filter((h) => h.risk_level === "MEDIUM RISK").length;
      const lo = STATE.history.filter((h) => h.risk_level === "LOW RISK").length;
      riskChart = new Chart(cv, {
        type: "doughnut",
        data: { labels: ["High Risk", "Medium Risk", "Low Risk"], datasets: [{ data: [hi, med, lo], backgroundColor: ["#E11D48", "#D97706", "#059669"], borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, cutout: "68%", plugins: { legend: { position: "bottom" } } },
      });
    }

    function viewHistory() {
      const q = STATE.histSearch.toLowerCase().trim();
      const list = STATE.history.filter((h) => {
        if (STATE.histRisk !== "ALL" && h.risk_level !== STATE.histRisk) return false;
        if (q && !(JSON.stringify(h.extracted_data) + h.risk_headline).toLowerCase().includes(q)) return false;
        return true;
      });
      return `
        <div class="max-w-5xl mx-auto px-4 sm:px-6 pt-8 space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div><h1 class="font-display text-2xl sm:text-3xl font-bold">Verification History</h1><p class="text-xs text-[var(--ink-muted)]">Stored privately in your browser.</p></div>
            <div class="flex gap-2">
              <button type="button" onclick="exportHistory('json')" class="px-3.5 py-2 rounded-full text-xs font-bold bg-[var(--surface)] border border-[var(--line)]">⬇ JSON</button>
              <button type="button" onclick="exportHistory('csv')" class="px-3.5 py-2 rounded-full text-xs font-bold bg-[var(--surface)] border border-[var(--line)]">⬇ CSV</button>
              <button type="button" onclick="STATE.history=[]; saveHistory(); render();" class="px-3.5 py-2 rounded-full text-xs font-bold bg-rose-50 dark:bg-rose-950/50 text-rose-600">Clear All</button>
            </div>
          </div>
          <div class="flex flex-wrap gap-2.5">
            <input type="text" value="${esc(STATE.histSearch)}" oninput="STATE.histSearch=this.value; render();" placeholder="Search employer, role, or email..." class="flex-1 min-w-[200px] rounded-full border border-[var(--line)] bg-[var(--surface)] px-4 py-2.5 text-xs" />
            <select onchange="STATE.histRisk=this.value; render();" class="rounded-full border border-[var(--line)] bg-[var(--surface)] px-4 py-2.5 text-xs font-semibold">
              <option value="ALL" ${STATE.histRisk === "ALL" ? "selected" : ""}>All Risk Levels</option>
              <option value="HIGH RISK" ${STATE.histRisk === "HIGH RISK" ? "selected" : ""}>HIGH RISK</option>
              <option value="MEDIUM RISK" ${STATE.histRisk === "MEDIUM RISK" ? "selected" : ""}>MEDIUM RISK</option>
              <option value="LOW RISK" ${STATE.histRisk === "LOW RISK" ? "selected" : ""}>LOW RISK</option>
            </select>
          </div>
          ${list.length === 0 ? `<div class="card-ui p-10 text-center text-xs text-[var(--ink-muted)]">No matching records.</div>` : `
            <div class="space-y-2.5">
              ${list.map((h) => `
                <div class="card-ui p-4 flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <div class="text-xs font-bold">${esc(h.risk_level)} (${h.risk_index}/100) • ${esc(h.extracted_data.employer.value || "Unknown Employer")} — ${esc(h.extracted_data.role.value || "Role Unspecified")}</div>
                    <div class="text-[11px] text-[var(--ink-muted)]">${esc(h.timestamp)} • Coverage ${h.evidence_coverage_percent}%</div>
                  </div>
                  <div class="flex gap-2">
                    <button type="button" onclick="STATE.currentReport=STATE.history.find(x=>x.report_id==='${h.report_id}'); STATE.step=3; nav('/verify');" class="px-3.5 py-1.5 rounded-full text-xs font-bold bg-indigo-600 text-white">View</button>
                    <button type="button" onclick="exportReportMd(STATE.history.find(x=>x.report_id==='${h.report_id}'))" class="px-3 py-1.5 rounded-full text-xs font-bold bg-[var(--surface-muted)]">MD</button>
                    <button type="button" onclick="STATE.history=STATE.history.filter(x=>x.report_id!=='${h.report_id}'); saveHistory(); render();" class="px-3 py-1.5 rounded-full text-xs font-bold text-rose-600 bg-rose-50 dark:bg-rose-950/40">Del</button>
                  </div>
                </div>
              `).join("")}
            </div>
          `}
        </div>
      `;
    }

    function viewLearn() {
      const q = QUIZ_QUESTIONS[STATE.quizIdx];
      return `
        <div class="max-w-5xl mx-auto px-4 sm:px-6 pt-8 space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div><h1 class="font-display text-2xl sm:text-3xl font-bold">Recruitment Scam Academy & Quiz</h1><p class="text-xs text-[var(--ink-muted)]">Learn 10 real recruitment fraud tactics and test your instincts.</p></div>
            <div class="flex p-1 rounded-full bg-[var(--surface-muted)] border border-[var(--line)]">
              <button type="button" onclick="STATE.learnTab='academy'; render();" class="px-4 py-1.5 rounded-full text-xs font-bold ${STATE.learnTab === "academy" ? "bg-indigo-600 text-white" : ""}">🎓 10 Modules</button>
              <button type="button" onclick="STATE.learnTab='quiz'; render();" class="px-4 py-1.5 rounded-full text-xs font-bold ${STATE.learnTab === "quiz" ? "bg-indigo-600 text-white" : ""}">🧠 Fraud Quiz (${STATE.quizBest}/${QUIZ_QUESTIONS.length})</button>
            </div>
          </div>

          ${STATE.learnTab === "academy" ? `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${ACADEMY_MODULES.map((m) => `
                <div class="card-ui p-5 space-y-2.5 text-xs">
                  <div class="flex justify-between items-center"><span class="px-2.5 py-0.5 rounded-full font-bold bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300">Module ${m.n} • ${esc(m.cat)}</span></div>
                  <h2 class="font-display text-base font-bold">${esc(m.title)}</h2>
                  <p class="text-[var(--ink-muted)]">${esc(m.summary)}</p>
                  <ul class="list-disc pl-4 text-rose-700 dark:text-rose-300 space-y-0.5">${m.redFlags.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
                  <div class="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-800 dark:text-emerald-200"><strong>Safe Action:</strong> ${esc(m.safe)}</div>
                </div>
              `).join("")}
            </div>
          ` : STATE.quizDone ? `
            <div class="card-ui p-10 text-center space-y-4">
              <div class="text-4xl">🏆</div>
              <h2 class="font-display text-2xl font-bold">You scored ${STATE.quizScore} / ${QUIZ_QUESTIONS.length}!</h2>
              <button type="button" onclick="STATE.quizIdx=0; STATE.quizScore=0; STATE.quizDone=false; STATE.quizSubmitted=false; render();" class="btn-indigo px-6 py-2.5 rounded-full text-xs font-bold">Play Again</button>
            </div>
          ` : `
            <div class="card-ui p-6 space-y-5 max-w-3xl mx-auto">
              <div class="flex justify-between text-xs font-bold text-[var(--ink-muted)]"><span>Question ${STATE.quizIdx + 1} of ${QUIZ_QUESTIONS.length}</span><span>From: ${esc(q.sender)}</span></div>
              <div class="p-4 rounded-2xl bg-[var(--canvas)] border border-[var(--line)] font-mono text-xs leading-relaxed">${esc(q.msg)}</div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button type="button" onclick="if(!STATE.quizSubmitted){STATE.quizChoice='scam'; STATE.quizSubmitted=true; if(q.ans==='scam') STATE.quizScore++; render();}" class="p-4 rounded-2xl border-2 text-left text-xs font-bold transition ${STATE.quizChoice === "scam" ? "border-rose-500 bg-rose-50/50 dark:bg-rose-950/30" : "border-[var(--line)] hover:border-indigo-400"}">🚨 Fraudulent Recruitment Scam</button>
                <button type="button" onclick="if(!STATE.quizSubmitted){STATE.quizChoice='legitimate'; STATE.quizSubmitted=true; if(q.ans==='legitimate') STATE.quizScore++; render();}" class="p-4 rounded-2xl border-2 text-left text-xs font-bold transition ${STATE.quizChoice === "legitimate" ? "border-emerald-500 bg-emerald-50/50 dark:bg-emerald-950/30" : "border-[var(--line)] hover:border-indigo-400"}">✅ Legitimate Recruitment Message</button>
              </div>
              ${STATE.quizSubmitted ? `
                <div class="p-4 rounded-2xl bg-[var(--surface-muted)] text-xs space-y-2.5">
                  <div class="font-bold">${STATE.quizChoice === q.ans ? "✅ Correct!" : "❌ Not quite"}</div>
                  <div>${esc(q.exp)}</div>
                  <button type="button" onclick="if(STATE.quizIdx+1<QUIZ_QUESTIONS.length){STATE.quizIdx++; STATE.quizChoice=null; STATE.quizSubmitted=false;}else{STATE.quizDone=true; if(STATE.quizScore>STATE.quizBest){STATE.quizBest=STATE.quizScore; localStorage.setItem(STORE.QUIZ, String(STATE.quizBest));}} render();" class="btn-indigo px-5 py-2 rounded-full text-xs font-bold">${STATE.quizIdx + 1 < QUIZ_QUESTIONS.length ? "Next Question →" : "See Final Score →"}</button>
                </div>
              ` : ""}
            </div>
          `}
        </div>
      `;
    }

    function viewHelp() {
      return `
        <div class="max-w-5xl mx-auto px-4 sm:px-6 pt-8 space-y-6">
          <div><h1 class="font-display text-2xl sm:text-3xl font-bold">Report Recruitment Fraud & Emergency Help</h1><p class="text-xs text-[var(--ink-muted)]">Official India cybercrime channels—verified government resources only.</p></div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="card-ui p-6 border-rose-300 dark:border-rose-800 space-y-2.5">
              <span class="text-xs font-extrabold uppercase text-rose-600">Financial Cyber Fraud Helpline (India)</span>
              <div class="font-display text-4xl font-bold">Dial 1930</div>
              <p class="text-xs text-[var(--ink-muted)]">If you paid a fake recruiter via UPI, NEFT/IMPS, or card, call 1930 immediately to request a bank-level transaction freeze.</p>
              <a href="tel:1930" class="inline-block px-5 py-2.5 rounded-full bg-rose-600 text-white text-xs font-bold">📞 Call 1930 Now</a>
            </div>
            <div class="card-ui p-6 space-y-2.5">
              <span class="text-xs font-extrabold uppercase text-indigo-600 dark:text-indigo-300">National Cyber Crime Reporting Portal</span>
              <div class="font-display text-2xl font-bold">cybercrime.gov.in</div>
              <p class="text-xs text-[var(--ink-muted)]">Submit screenshots of the job ad, fake offer letter, recruiter phone/email, and 12-digit UTR numbers.</p>
              <a href="https://cybercrime.gov.in/" target="_blank" rel="noopener noreferrer" class="inline-block btn-indigo px-5 py-2.5 rounded-full text-xs font-bold">🌐 Open cybercrime.gov.in ↗</a>
            </div>
          </div>
          <div class="card-ui p-6 space-y-2.5 text-xs">
            <h2 class="font-display font-bold text-sm">Golden-Hour Checklist</h2>
            <ol class="list-decimal pl-5 space-y-1.5 text-[var(--ink-muted)]">
              <li>Stop all transfers immediately and block the recruiter on WhatsApp, Telegram, and email.</li>
              <li>If you installed AnyDesk or TeamViewer, disconnect from the internet and uninstall it at once.</li>
              <li>Export your JobGuard AI Markdown/JSON report and save chat screenshots plus UTR transaction IDs.</li>
              <li>Call 1930 and register a formal complaint at cybercrime.gov.in.</li>
            </ol>
          </div>
        </div>
      `;
    }

    function viewSettings() {
      const s = STATE.settings;
      return `
        <div class="max-w-3xl mx-auto px-4 sm:px-6 pt-8 space-y-6">
          <div><h1 class="font-display text-2xl sm:text-3xl font-bold">Settings & Privacy</h1><p class="text-xs text-[var(--ink-muted)]">Control interface language, appearance, PII redaction, and local storage.</p></div>
          <div class="card-ui p-6 divide-y divide-[var(--line)] text-xs">
            <div class="py-3.5 flex justify-between items-center">
              <div><div class="font-bold text-sm">Interface Language (English / हिंदी)</div><div class="text-[var(--ink-muted)]">Independent from detected message language.</div></div>
              <button type="button" onclick="toggleLang()" class="px-4 py-2 rounded-full font-bold bg-indigo-600 text-white">${s.lang === "hi" ? "हिंदी Active" : "English Active"}</button>
            </div>
            <div class="py-3.5 flex justify-between items-center">
              <div><div class="font-bold text-sm">Color Theme</div><div class="text-[var(--ink-muted)]">Warm Ivory Light or Obsidian Indigo Dark.</div></div>
              <button type="button" onclick="toggleTheme()" class="px-4 py-2 rounded-full font-bold bg-[var(--surface-muted)]">${s.theme === "dark" ? "🌙 Dark" : "☀️ Light"}</button>
            </div>
            <div class="py-3.5 flex justify-between items-center">
              <div><div class="font-bold text-sm">Reduced Motion</div><div class="text-[var(--ink-muted)]">Disable transitions and hover lift effects.</div></div>
              <button type="button" onclick="toggleSetting('reducedMotion')" class="px-4 py-2 rounded-full font-bold ${s.reducedMotion ? "bg-indigo-600 text-white" : "bg-[var(--surface-muted)]"}">${s.reducedMotion ? "Enabled" : "Disabled"}</button>
            </div>
            <div class="py-3.5 flex justify-between items-center">
              <div><div class="font-bold text-sm">Automatic Sensitive Data Redaction</div><div class="text-[var(--ink-muted)]">Masks Aadhaar, PAN, IFSC, bank numbers, and OTP/PIN codes.</div></div>
              <button type="button" onclick="toggleSetting('redactSensitive')" class="px-4 py-2 rounded-full font-bold ${s.redactSensitive ? "bg-indigo-600 text-white" : "bg-[var(--surface-muted)]"}">${s.redactSensitive ? "Enabled" : "Disabled"}</button>
            </div>
            <div class="py-3.5 flex justify-between items-center">
              <div><div class="font-bold text-sm">Save Local Verification History</div><div class="text-[var(--ink-muted)]">Opt-in browser persistence; zero account required.</div></div>
              <button type="button" onclick="toggleSetting('saveHistory')" class="px-4 py-2 rounded-full font-bold ${s.saveHistory ? "bg-indigo-600 text-white" : "bg-[var(--surface-muted)]"}">${s.saveHistory ? "Enabled" : "Disabled"}</button>
            </div>
            <div class="pt-4 flex justify-end">
              <button type="button" onclick="resetAllData()" class="px-4 py-2 rounded-full font-bold bg-rose-50 dark:bg-rose-950/50 text-rose-600">Reset All Local Data</button>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      renderNavBars();
      const root = document.getElementById("app-root");
      if (!root) return;
      const r = STATE.route;
      if (r === "/" || r === "") root.innerHTML = viewLanding();
      else if (r === "/verify" || r === "/report") root.innerHTML = viewVerifyStudio();
      else if (r === "/dashboard") { root.innerHTML = viewDashboard(); setTimeout(initCharts, 40); }
      else if (r === "/history") root.innerHTML = viewHistory();
      else if (r === "/learn") root.innerHTML = viewLearn();
      else if (r === "/help") root.innerHTML = viewHelp();
      else if (r === "/settings") root.innerHTML = viewSettings();
      else root.innerHTML = viewLanding();
    }

    window.addEventListener("hashchange", () => {
      STATE.route = (window.location.hash || "#/").slice(1) || "/";
      render();
    });

    loadState();
    detectBackend();
    STATE.route = (window.location.hash || "#/").slice(1) || "/";
    render();
  </script>
</body>
</html>
